<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>간단한 분기 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .yes { background-color: #4CAF50; color: white; }
    .no { background-color: #f44336; color: white; }
  </style>
</head>
<body>

<div class="container" id="questionBox">
  <h2 id="questionText"></h2>
  <button class="yes" onclick="answer(true)">예</button>
  <button class="no" onclick="answer(false)">아니오</button>
</div>

<div class="container" id="resultBox" style="display:none;">
  <h2 id="resultText"></h2>
  <button onclick="restart()">다시하기</button>
</div>

<script>
  const questions = [
    "심심한가?",
    "혼자는 싫은가?",
    "짧은 쉼이 필요한가?"
  ];

  let currentQuestion = 0;
  let allYes = true;

  function loadQuestion() {
    document.getElementById("questionText").innerText = questions[currentQuestion];
  }

  function answer(isYes) {
    if (!isYes) {
      allYes = false;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById("questionBox").style.display = "none";
    document.getElementById("resultBox").style.display = "block";

    if (allYes) {
      document.getElementById("resultText").innerText = "A 결과 화면 🎉\n\n당신은 지금 완벽한 휴식이 필요합니다!";
    } else {
      document.getElementById("resultText").innerText = "B 결과 화면 🌿\n\n조금만 더 버텨볼까요?";
    }
  }

  function restart() {
    currentQuestion = 0;
    allYes = true;
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("questionBox").style.display = "block";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
