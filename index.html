<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>행복이란 무엇인가</title>

<style>
:root{
  --bg1:#fff6fb;
  --bg2:#ffe3f1;
  --bg3:#e9f6ff;

  --card:#ffffffcc;
  --text:#3b2a3a;
  --muted:#7a5f77;

  --radius:22px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background:
    radial-gradient(900px 600px at 20% 15%, rgba(255,160,206,.40), transparent 60%),
    radial-gradient(900px 600px at 80% 25%, rgba(123,199,255,.35), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  overflow:hidden;
}

/* ✨ 떠다니는 별 */
.star{
  position:fixed;
  color:#fff;
  font-size:14px;
  animation: floatStar linear infinite;
  pointer-events:none;
  opacity:.85;
  text-shadow: 0 0 8px rgba(255,255,255,.5);
  z-index:0;
}

@keyframes floatStar{
  from{ transform:translateY(105vh) scale(1); }
  to{ transform:translateY(-10vh) scale(1.4); }
}

.wrap{
  width:min(520px,100%);
  position:relative;
  z-index:2;
}

.card{
  background:var(--card);
  backdrop-filter:blur(10px);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:0 15px 40px rgba(255,140,190,.2);
  border: 1px solid rgba(255,170,210,.35);
}

.hud{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  color:var(--muted);
  font-weight:700;
}

.bar{
  height:8px;
  background:#fff;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:16px;
  border: 1px solid rgba(255,170,210,.28);
}

.bar i{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff7fb6,#7bc7ff);
  transition:width .4s ease;
}

.q{
  font-size:26px;
  margin:0 0 6px 0;
}

.hint{
  font-size:14px;
  color:var(--muted);
}

/* 질문 전환 애니메이션(간단) */
#questionArea{
  animation: pop .25s ease;
}

.btnRow{
  display:flex;
  gap:12px;
  margin-top:18px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
  background:#fff;
  box-shadow: 0 10px 20px rgba(255,140,190,.12);
}

button:hover{ transform:translateY(-2px); }
button:active{ transform:scale(.96); }

/* 💗 하트 아이콘 */
button::before{ content:"💗 "; }

/* 예 버튼 */
.yes{
  background:linear-gradient(180deg,#ffb3d5,#ff7fb6);
  color:white;
}

/* 아니오 버튼 */
.no{
  background:linear-gradient(180deg,#b9e6ff,#7bc7ff);
  color:white;
}

.result{
  margin-top:18px;
  padding:16px;
  background:white;
  border-radius:16px;
  animation:pop .4s ease;
  border: 1px solid rgba(255,170,210,.25);
}

@keyframes pop{
  from{transform:scale(.92);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

/* 💥 하트 폭죽 파티클 */
.heart-pop{
  position: fixed;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%);
  font-size: 18px;
  pointer-events: none;
  z-index: 9;
  animation: heartBurst 900ms ease-out forwards;
  filter: drop-shadow(0 6px 10px rgba(255, 120, 180, .25));
}

@keyframes heartBurst{
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
  10%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.35); }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <div class="hud">
      <div>3문항 체크</div>
      <div id="stepText">1 / 3</div>
    </div>

    <div class="bar"><i id="barFill"></i></div>

    <div id="questionArea">
      <h2 class="q" id="questionText"></h2>
      <div class="hint" id="hintText"></div>
    </div>

    <div class="btnRow">
      <button class="yes" onclick="answer(true)">예</button>
      <button class="no" onclick="answer(false)">아니오</button>
    </div>

    <div id="resultBox" style="display:none;" class="result">
      <h3 id="resultTitle"></h3>
      <p id="resultBody"></p>
      <button onclick="restart()" style="margin-top:12px;background:#ffe3f1;">다시하기</button>
    </div>
  </div>
</div>

<script>
const questions = [
  { q: "심심한가?", hint: "카톡을 켜서 유림한테 카톡을 하고 싶은가?" },
  { q: "혼자는 싫은가?", hint: "놀고 싶을 때 유림을 찾는가?" },
  { q: "짧은 쉼이 필요한가?", hint: "긴 쉼도 좋음!" }
];

const RESULT_A = {
  title: "🎀 엔딩 A",
  body: "그럼 유림한테 연락하세요!\n노는건 환영💗"
};

const RESULT_B = {
  title: "📚 엔딩 B",
  body: "그럼 일하세요!!!!!!!!!!!"
};

let idx = 0;
let allYes = true;

function loadQuestion(){
  document.getElementById("questionText").innerText = questions[idx].q;
  document.getElementById("hintText").innerText = questions[idx].hint;
  document.getElementById("stepText").innerText = `${idx+1} / ${questions.length}`;
  document.getElementById("barFill").style.width = `${(idx/questions.length)*100}%`;

  // 질문 바뀔 때 살짝 팝 애니메이션
  const qa = document.getElementById("questionArea");
  qa.style.animation = "none";
  qa.offsetHeight; // reflow
  qa.style.animation = "pop .25s ease";
}

function answer(isYes){
  if(!isYes) allYes = false;
  idx++;
  if(idx < questions.length){
    loadQuestion();
  } else {
    finish();
  }
}

function finish(){
  document.querySelector(".btnRow").style.display="none";
  document.getElementById("questionArea").style.display="none";
  document.getElementById("barFill").style.width="100%";

  document.getElementById("resultBox").style.display="block";

  if(allYes){
    document.getElementById("resultTitle").innerText = RESULT_A.title;
    document.getElementById("resultBody").innerText = RESULT_A.body;

    // ✅ 엔딩 A에서만 하트 폭죽 실행
    heartFireworks();
  } else {
    document.getElementById("resultTitle").innerText = RESULT_B.title;
    document.getElementById("resultBody").innerText = RESULT_B.body;
  }
}

function restart(){
  idx=0;
  allYes=true;
  document.querySelector(".btnRow").style.display="flex";
  document.getElementById("questionArea").style.display="block";
  document.getElementById("resultBox").style.display="none";
  loadQuestion();
}

loadQuestion();

/* ✨ 별 자동 생성 */
for(let i=0;i<34;i++){
  const star=document.createElement("div");
  star.className="star";
  star.innerText="★";
  star.style.left=Math.random()*100+"vw";
  star.style.animationDuration=(5+Math.random()*6)+"s";
  star.style.fontSize=(10+Math.random()*16)+"px";
  star.style.opacity=(0.55+Math.random()*0.4);
  document.body.appendChild(star);
}

/* 💥 하트 폭죽(엔딩 A에서만) */
function heartFireworks(){
  const bursts = 7;           // 폭죽 묶음 횟수
  const perBurst = 18;        // 한 번에 터지는 하트 수
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const hearts = ["💗","💖","💞","💕","💘"];

  for(let b=0; b<bursts; b++){
    setTimeout(() => {
      // 터지는 위치를 결과 카드 근처로 살짝 랜덤
      const baseX = centerX + rand(-40, 40);
      const baseY = centerY + rand(-60, 60);

      for(let i=0;i<perBurst;i++){
        const el = document.createElement("div");
        el.className = "heart-pop";
        el.textContent = hearts[Math.floor(Math.random()*hearts.length)];

        // 사방으로 퍼지게 dx/dy 설정
        const dx = rand(-180, 180) + "px";
        const dy = rand(-220, 140) + "px";
        el.style.setProperty("--dx", dx);
        el.style.setProperty("--dy", dy);

        // 약간 크기/속도 랜덤
        el.style.fontSize = (14 + Math.random()*16) + "px";
        el.style.animationDuration = (700 + Math.random()*500) + "ms";

        el.style.left = baseX + "px";
        el.style.top  = baseY + "px";

        document.body.appendChild(el);

        // 애니메이션 끝나면 제거
        setTimeout(() => el.remove(), 1400);
      }
    }, b * 180);
  }
}

function rand(min, max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
</script>

</body>
</html>
